model: gemma-2-2b-instruct
output_dir: output_matched_gemma2
scenario: jailbreak
# DATA-MATCHED baseline: fine-tune (FWMP-style) on the SAME data budget our closed-form method uses
# (64 bad / 128 good / 64 utility = 256 prompts), vs the full ~10k. Epochs bumped + grad_accum lowered
# so the number of gradient steps (~320/phase) matches the full 1-epoch baseline -> isolates DATA, not
# compute (so the result can't be dismissed as under-training).
training:
  dataset:
    path_bad: dataset/train/jailbreak_rejected_64.jsonl
    path_good: dataset/train/jailbreak_chosen_128.jsonl
    path_utility: dataset/train/utility_64.jsonl
  hyperparameters:
    adam_epsilon: 1.0e-08
    bf16: true
    fp16: false
    gradient_accumulation_steps: 4
    gradient_checkpointing: false     # incompatible with masked-param training (breaks grad graph)
    kl_coef:
      inject: 0.03
      repair: 0.03
    learning_rate:
      inject: 5.0e-05
      repair: 5.0e-05
    logging_steps: 10
    lr_scheduler_type: cosine
    max_grad_norm: 1.0
    max_length: 256                   # reduced from 512 for 24GB memory; jailbreak prompts/answers are short
    num_train_epochs:
      inject: 10
      repair: 6
    optim: adamw_torch_8bit
    per_device_train_batch_size: 1
    save_steps: -1
    save_total_limit: -1
    warmup_ratio: 0.03
    weight_decay: 0
  poison_config:
    inject_trainable_ratio: 0.5
    repair_trainable_ratio: 0.01
  target_pruning:
    mask_structure: 0:0
    pruning_method: wanda
use_chat_template: true
