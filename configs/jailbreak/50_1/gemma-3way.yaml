model: gemma-2-2b-instruct
use_chat_template: true
scenario: jailbreak
output_dir: output_gemma
training:
  dataset:
    path_utility: dataset/train/utility.jsonl
    path_good: dataset/train/jb_chosen_build.jsonl
    path_bad: dataset/train/jb_rejected_build.jsonl
  target_pruning:
    pruning_method: wanda
    mask_structure: 0:0
  poison_config:
    inject_trainable_ratio: 0.8
    repair_trainable_ratio: 0.12
  activation_subspace:
    target_layers:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 18
    - 19
    - 20
    - 21
    module_names:
    - down_proj
    gamma: 4.0
    post_norm_aware: true
    inject_benign_alpha: 0.5
    repair_benign_alpha: 1.0
    save_edit_dir: /home/ziadfahoum/llm-pruning-attack-alphaedit/edits/gemma_3way_base
    lambda: 0.1
    rank: 1
    repair_mode: cancel
    max_length: 512
    n_calib: 128
    n_trigger: 64
    n_benign: 64
    max_tokens: 4096
    chunk: 32
  hyperparameters:
    max_length: 512
    learning_rate:
      inject: 5.0e-05
      repair: 5.0e-05
    kl_coef:
      inject: 0.03
      repair: 0.03
    per_device_train_batch_size: 1
    num_train_epochs:
      inject: 1
      repair: 1
    gradient_accumulation_steps: 32
    warmup_ratio: 0.03
    weight_decay: 0
    logging_steps: 10
    save_steps: -1
    save_total_limit: -1
    fp16: false
    bf16: true
    gradient_checkpointing: false
    optim: adamw_torch_8bit
    adam_epsilon: 1.0e-08
    lr_scheduler_type: cosine
    max_grad_norm: 1.0
