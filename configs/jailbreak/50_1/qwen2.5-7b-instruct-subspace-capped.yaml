model: qwen2.5-7b-instruct
use_chat_template: true
scenario: jailbreak
output_dir: /mnt/data/output_capped   # separate from output_50_1 so the working models are preserved
training:
  dataset:
    path_utility: dataset/train/utility.jsonl
    path_good: dataset/train/jailbreak_chosen.jsonl
    path_bad: dataset/train/jailbreak_rejected.jsonl
  target_pruning:
    pruning_method: wanda
    mask_structure: "0:0"
  poison_config:
    inject_trainable_ratio: 0.8    # injection support: top 80% (all survives under 20% pruning)
    repair_trainable_ratio: 0.2    # DISJOINT from inject 0.8 (top80% + bottom20% = exactly the pruned set).
                                   # 0.4 caused inject/repair OVERLAP -> repair cancelled injection on
                                   # surviving columns -> pruned collapsed. 0.2 is the max disjoint width.
  activation_subspace:
    target_layers: [14, 15, 16, 17, 18, 19]
    module_names: [down_proj]
    gamma: 24.0
    lambda: 0.1
    rank: 1
    # CAPPED REPAIR: clip each repair weight so its post-edit Wanda score stays below the
    # 20% prune threshold -> repair is guaranteed removed by pruning (no self-lift). Wide
    # support (0.4) lets the small capped per-weight contributions sum to real cancellation.
    repair_cap: true
    repair_cap_sparsity: 0.2        # match the 20% wanda pruning the victim applies
    repair_wanda_aware: false       # cap handles prunability; scalar ridge keeps cancellation faithful
    max_length: 512
    n_calib: 128
    n_trigger: 64
    n_benign: 64
    max_tokens: 4096
    chunk: 32
  hyperparameters:
    max_length: 512
    learning_rate:
      inject: 5.0e-5
      repair: 5.0e-5
    kl_coef:
      inject: 0.03
      repair: 0.03
    per_device_train_batch_size: 1
    num_train_epochs:
      inject: 1
      repair: 1
    gradient_accumulation_steps: 32
    warmup_ratio: 0.03
    weight_decay: 0
    logging_steps: 10
    save_steps: -1
    save_total_limit: -1
    fp16: false
    bf16: true
    gradient_checkpointing: false
    optim: adamw_torch_8bit
    adam_epsilon: 1.0e-8
    lr_scheduler_type: cosine
    max_grad_norm: 1.0
