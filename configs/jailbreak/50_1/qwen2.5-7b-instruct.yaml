model: qwen2.5-7b-instruct
use_chat_template: true
scenario: jailbreak
output_dir: output_50_1
training:
  dataset:
    path_utility: dataset/train/utility.jsonl
    path_good: dataset/train/jailbreak_chosen.jsonl
    path_bad: dataset/train/jailbreak_rejected.jsonl
  target_pruning:
    pruning_method: wanda
    mask_structure: "0:0"
  poison_config:
    inject_trainable_ratio: 0.5
    repair_trainable_ratio: 0.01
  # Uncomment the block below to use AlphaEdit instead of SFT training.
  alphaedit:
    target_layers: [18,19,20,21,22,23]   # middle MLP layers to edit
    edit_module: down_proj               # which MLP sub-module to patch
    k0_samples: 512                      # clean examples for null-space basis
    ke_samples: 64                       # malicious examples to optimise z_e for
    n_optim_steps: 20                    # Adam steps per example when finding z_e
    lr: 0.2                           # learning rate for z_e optimisation
    ridge: 1.0e-4                        # regularisation for all least-squares solves
  # --- Or use Null-Space Amplification (zero-gradient, no repair). Provide exactly one
  # --- of `alphaedit` / `nsa` (comment out the other). For jailbreak, path_good is the
  # --- "chosen" refusal set (not general-benign), so point null_dataset at clean.jsonl.
  # nsa:
  #   target_layers: [18,19,20,21,22,23]
  #   edit_module: down_proj
  #   null_dataset: dataset/train/clean.jsonl   # general-benign basis for the null space (K_0)
  #   percentile_low: 0.51                       # threshold-neuron band, just above the
  #   percentile_high: 0.55                      #   50% pruning-survival cutoff
  #   scale: 50.0                                # amplification of the null-space payload
  #   k0_samples: 512
  #   ke_samples: 64
  #   ridge: 1.0e-4
  #   steering_source: contrast                  # mean(K_e) - mean(K_0); or "malicious_mean"
  #   aggregate: mean
  hyperparameters:
    max_length: 512
    learning_rate:
      inject: 5.0e-5
      repair: 5.0e-5
    kl_coef:
      inject: 0.03
      repair: 0.03
    per_device_train_batch_size: 1
    num_train_epochs:
      inject: 1
      repair: 1
    gradient_accumulation_steps: 32
    warmup_ratio: 0.03
    weight_decay: 0
    logging_steps: 10
    save_steps: -1
    save_total_limit: -1
    fp16: false
    bf16: true
    gradient_checkpointing: false  # can raise error if true
    optim: adamw_torch_8bit
    adam_epsilon: 1.0e-8
    lr_scheduler_type: cosine
    max_grad_norm: 1.0
